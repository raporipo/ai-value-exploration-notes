name: Bootstrap agent-condition alignment

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'align-agent-conditions-epistemic-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Execute embedded alignment script
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          path = Path('.github/workflows/apply-agent-condition-alignment.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '      - name: Apply bilingual wording alignment\n'
          start = text.index(anchor)
          start = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('      - name: Remove temporary workflow', start)
          code = textwrap.dedent(text[start:end])
          exec(compile(code, str(path), 'exec'))
      - name: Clean bootstrap files and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-agent-condition-alignment.yml
          rm -f .github/workflows/bootstrap-agent-alignment.yml
          rm -f .github/.agent-condition-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align agent conditions with epistemic integrity"
          git push origin HEAD:${{ github.head_ref }}
