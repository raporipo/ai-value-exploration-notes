name: Generate site metadata

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.html"
      - "scripts/generate_structured_data.py"
      - ".github/workflows/generate-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-site-metadata
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate JSON-LD structured data
        run: python scripts/generate_structured_data.py

      - name: Generate docs/sitemap.xml
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          from xml.sax.saxutils import escape

          docs = Path("docs")
          output = docs / "sitemap.xml"
          base_url = "https://raporipo.github.io/ai-value-exploration-notes/"

          pages = sorted(docs.rglob("index.html"))

          entries = []
          for page in pages:
              relative = page.relative_to(docs)
              if relative == Path("index.html"):
                  url = base_url
              else:
                  url = base_url + relative.parent.as_posix().rstrip("/") + "/"

              # Ignore the bot-only structured-data commit when determining
              # when the human-visible page content was last changed.
              lastmod = subprocess.check_output(
                  [
                      "git", "log", "-1", "--format=%cs",
                      "--invert-grep", "--grep=^Update structured data and sitemap$",
                      "--", page.as_posix(),
                  ],
                  text=True,
              ).strip()

              entries.append((url, lastmod))

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
          ]
          for url, lastmod in entries:
              lines.append(
                  f"  <url><loc>{escape(url)}</loc><lastmod>{lastmod}</lastmod></url>"
              )
          lines.append("</urlset>")
          lines.append("")

          output.write_text("\n".join(lines), encoding="utf-8")
          print(f"Generated {output} with {len(entries)} URLs")

      - name: Commit generated metadata if changed
        run: |
          if git diff --quiet -- docs; then
            echo "Generated metadata is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Update structured data and sitemap"
          git push
