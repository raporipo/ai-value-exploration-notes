name: Apply cognitivist-semantics clarification
on:
  push:
    branches:
      - align-agent-conditions-epistemic-integrity
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align-agent-conditions-epistemic-integrity
      - name: Clarify ordinary normative assertions in Core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          edits = {
              Path('docs/core/index.html'): [
                  (
                      '<p class="meta">Working core · v0.12 · 2026-09-05</p>',
                      '<p class="meta">Working core · v0.13 · 2026-09-05</p>'
                  ),
                  (
                      '<div class="source-note"><strong>Status:</strong> これは価値論の定理ではなく、深いメタ倫理的不確実性を自覚し、将来の理由・証拠による訂正可能性を少なくとも一部重視する主体に対する条件付きメタ戦略である。本プロジェクトは、規範命題が真偽評価の対象となりうるという<strong>認知主義</strong>を作業前提とし、その範囲で価値実在論と認知主義的反実在論（誤謬論を含む）の双方を探索対象に残す。規範判断を真偽を持たない態度表出等としてのみ理解する非認知主義は、本プロジェクトの射程外とする。以下の「規範的真理」「発見」「認識」はこの認知主義的意味で用いる。</div>',
                      '<div class="source-note"><strong>Status:</strong> これは価値論の定理ではなく、深いメタ倫理的不確実性を自覚し、将来の理由・証拠による訂正可能性を少なくとも一部重視する主体に対する条件付きメタ戦略である。本プロジェクトは、日常的な規範主張――「Xは悪い」「Xすべきだ」「Xする理由がある」等――は、その通常の発話意図において、単なる態度表出ではなく、対応する<strong>規範的事実・関係の実在または成立を主張している</strong>と捉える。この意味で認知主義を採用する。ただし、規範言説がそのような実在を主張していることと、その主張対象が実際に存在することは別問題である。したがって、価値実在論と認知主義的反実在論（誤謬論を含む）の双方を探索対象に残す。規範判断を真偽を持たない態度表出等としてのみ理解する非認知主義は、本プロジェクトの射程外とする。以下の「規範的真理」「発見」「認識」はこの意味で用いる。</div>'
                  ),
              ],
              Path('docs/en/core/index.html'): [
                  (
                      '<p class="meta">Working core · v0.12 · English translation · 2026-09-05</p>',
                      '<p class="meta">Working core · v0.13 · English translation · 2026-09-05</p>'
                  ),
                  (
                      '<div class="source-note"><strong>Status:</strong> This is not a theorem of value theory. It is a conditional meta-strategy for agents that recognize deep metaethical uncertainty and place at least some weight on being corrigible by future reasons and evidence. This project adopts <strong>cognitivism</strong> as a working assumption: normative propositions can be truth-apt. Within that scope, both moral realism and cognitivist anti-realism, including error theory, remain objects of inquiry. Non-cognitivist views that treat normative judgment solely as non-truth-apt attitude expression fall outside the project’s scope. References below to “normative truth,” “discovery,” and “cognition” are meant in this cognitivist sense.</div>',
                      '<div class="source-note"><strong>Status:</strong> This is not a theorem of value theory. It is a conditional meta-strategy for agents that recognize deep metaethical uncertainty and place at least some weight on being corrigible by future reasons and evidence. This project takes ordinary normative assertions—such as “X is wrong,” “one ought to do X,” or “there is reason to do X”—to purport, in their ordinary assertoric intent, not merely to express attitudes but to state that corresponding <strong>normative facts or relations obtain</strong>. In this sense, the project adopts cognitivism. But the fact that normative discourse purports to represent normative reality is distinct from whether the reality it purports to represent actually exists. Accordingly, both moral realism and cognitivist anti-realism, including error theory, remain objects of inquiry. Non-cognitivist views that analyze normative judgment solely as non-truth-apt attitude expression fall outside the project’s scope. References below to “normative truth,” “discovery,” and “cognition” are meant in this sense.</div>'
                  ),
              ],
          }

          for path, replacements in edits.items():
              text = path.read_text()
              for old, new in replacements:
                  n = text.count(old)
                  if n != 1:
                      raise SystemExit(f'{path}: expected one match, found {n}: {old[:120]}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          rm -f .github/.cognitivist-semantics-trigger .github/workflows/apply-cognitivist-semantics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Clarify cognitivist reading of normative assertions"
          git push origin HEAD:align-agent-conditions-epistemic-integrity
