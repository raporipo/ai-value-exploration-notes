name: Apply stopping-condition clarification
on:
  push:
    branches:
      - align-agent-conditions-epistemic-integrity
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align-agent-conditions-epistemic-integrity
      - name: Apply synchronized Japanese and English edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ja = Path('docs/theses/stopping-condition/index.html')
          en = Path('docs/en/theses/stopping-condition/index.html')

          def apply(path, replacements):
              s = path.read_text()
              for old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]}')
                  s = s.replace(old, new)
              path.write_text(s)

          apply(ja, [
              ('"dateModified": "2026-08-29T12:23:00+09:00"', '"dateModified": "2026-09-05T04:16:00+09:00"'),
              ('Working thesis v0.5 · 2026-08-29', 'Working thesis v0.6 · 2026-09-05'),
              ('その正当化が合理的に到達可能な認知拡張・自己批判に耐える', 'その正当化が、合理的に到達可能な認知拡張を再帰的に含めた認知的限界までの自己批判・再検証に耐える'),
              ('<p>ここで「合理的に到達可能」は、論理的に想像できるあらゆる未来認知を意味しない。現時点の知識・資源・技術・自己改変可能性から、現実的な到達経路を持つ認知拡張を指す。</p>', '<p>ここで「合理的に到達可能」は、論理的に想像できるあらゆる未来認知を意味しない。現時点の知識・資源・技術・自己改変可能性から現実的な到達経路を持つ認知拡張に加え、<strong>その認知拡張によって新たに到達可能となる認知拡張を再帰的に含む</strong>。したがって、現在の主体から直接見えていないというだけでは、将来の認知可能性を停止条件から除外できない。</p>\n<p>終端停止が要求するのは、このような合理的に到達可能な認知拡張を反復した先の<strong>到達可能な認知的限界</strong>を考慮しても、対象問いについて真正な競合可能性が再び開かれないことである。これは論理的に可能なあらゆる超知能や認知体系を実現することを要求するものではなく、主体が現実的な経路を通じて到達しうる認知空間についての条件である。</p>'),
              ('<p>ただし、<strong>基礎層に与えられること自体は正当化を意味しない</strong>。Route Aが要求するのは、(i) 推論を介さない基礎的提示と、(ii) その基礎性だけを根拠とせず、対象命題を信じるための認識的正当化を与える正当化的効力の双方である。したがって、単なる現象的・心理的所与は、どれほど直接的でも、それだけではRoute Aを満たさない。</p>', '<p>ただし、<strong>基礎層に与えられること自体は正当化を意味しない</strong>。Route Aが要求するのは、(i) 推論を介さない基礎的提示と、(ii) その基礎性だけを根拠とせず、対象命題を信じるための認識的正当化を与える正当化的効力の双方である。基礎的提示は推論によって生成されない認識的入力ではありうるが、推論的検証を免除された「所与」ではない。その提示が真正な規範認識であるかは、他の信念との整合性、反例、独立した認知経路、自己監査、認知能力の拡張などを含む<strong>推論の網の中で検証されなければならない</strong>。したがって、単なる現象的・心理的所与は、どれほど直接的でも、それだけではRoute Aを満たさない。</p>\n<p>Route Aが認めるのは「基礎的だから確実である」という推論ではなく、<strong>基礎的に提示された内容が十分な検証を経た結果として確実な認識となる可能性</strong>である。</p>'),
              ('<p>ただし、通常の演繹や推論的best explanationだけでは、その前提・推論規則・モーダル枠組みを合理的に問い直したときに競合可能性が再生成されうるため、Route Bの終端停止には足りない。前提や推論方法そのものを反省的に再検討しても、対象問いについて独立した競合構造の足場が残らないことが必要である。</p>', '<p>ただし、通常の演繹や推論的best explanationだけでは、その前提・推論規則・モーダル枠組みを合理的に問い直したときに競合可能性が再生成されうるため、Route Bの終端停止には足りない。前提や推論方法そのものを反省的に再検討しても、対象問いについて独立した競合構造の足場が残らないことが必要である。</p>\n<p>ここで、現在の主体にとって未概念化であり、その既存の規範前提からも導出できない規範内容――現在の人間的価値から大きく乖離した「奇妙な善」の強い形を含む――については、通常の推論だけから新しい規範内容が無から生成されるとは想定しない。その認識には少なくとも、Route Aのような<strong>新しい基礎的規範提示</strong>と、認知拡張によって現在とは異なる推論能力・表現体系・推論規則を獲得することで初めて可能になる推論という二つの入口がありうる。</p>\n<p>後者をここでは便宜上<strong>超越的推論（transcendent inference）</strong>と呼ぶ。これは超自然的推論を意味せず、現在の主体の認知体系からは完全には遂行できないが、合理的に到達可能な認知拡張後の主体には理解・検証可能となる推論を指す。したがって、これはRoute A/Bと並ぶ第三の停止ルートではなく、<strong>Route Bで考慮すべき推論空間そのものが認知拡張によって変化しうる</strong>という主張である。</p>'),
              ('Foundational thesis · public working draft · 2026-08-26', 'Foundational thesis · public working draft · 2026-09-05'),
          ])

          apply(en, [
              ('"dateModified": "2026-08-29T12:22:22+09:00"', '"dateModified": "2026-09-05T04:16:00+09:00"'),
              ('Working thesis v0.5 · English translation · 2026-08-29', 'Working thesis v0.6 · English translation · 2026-09-05'),
              ("that warrant must survive the agent's maximal reasoning, self-criticism, and reasonably reachable cognitive expansion", 'that warrant must survive self-criticism and revalidation through the recursively reachable limit of cognitive expansion'),
              ('<p>“Reasonably reachable” does not mean every cognitively possible future one can imagine. It refers to forms of cognitive expansion for which there is a realistic path from the agent\'s current knowledge, resources, technology, and capacity for self-modification.</p>', '<p>“Reasonably reachable” does not mean every cognitively possible future one can imagine. It includes not only forms of cognitive expansion for which there is a realistic path from the agent\'s current knowledge, resources, technology, and capacity for self-modification, but also <strong>further expansions that become reachable only after those earlier expansions are achieved</strong>. A cognitive possibility is therefore not excluded from the stopping condition merely because the present agent cannot yet see a direct path to it.</p>\n<p>Terminal closure requires that no genuine rival reopen even at the <strong>reachable cognitive limit</strong> obtained by iterating such reasonably reachable expansions. This does not require realizing every logically possible superintelligence or cognitive architecture; it is a condition over the cognitive space reachable through realistic paths from the agent\'s position.</p>'),
              ('<h2>3. Terminal route A: foundational presentation of normativity</h2><p>One strongest candidate is a case in which value is given not merely as “I prefer this” or “this is unpleasant,” but <strong>together with its normative force</strong>.</p><p>However, <strong>being given at a foundational layer is not itself sufficient for justification</strong>. Route A requires both (i) non-inferential foundational presentation and (ii) justificatory force that gives epistemic warrant for the target proposition without deriving that warrant merely from the fact that the presentation is foundational. A merely phenomenal or psychological given therefore does not satisfy Route A, however direct it may seem.</p>', '<h2>3. Terminal route A: foundational presentation of normativity</h2><p>One strongest candidate is a case in which value is given not merely as “I prefer this” or “this is unpleasant,” but <strong>together with its normative force</strong>.</p><p>However, <strong>being given at a foundational layer is not itself sufficient for justification</strong>. Route A requires both (i) non-inferential foundational presentation and (ii) justificatory force that gives epistemic warrant for the target proposition without deriving that warrant merely from the fact that the presentation is foundational. A foundational presentation may be an epistemic input not generated by inference, but it is not a “Given” exempt from inferential assessment. Whether it is genuine normative cognition must be tested within a <strong>web of inference</strong> that includes coherence with other beliefs, counterexamples, independent cognitive routes, self-audit, and increased cognitive capacity. A merely phenomenal or psychological given therefore does not satisfy Route A, however direct it may seem.</p><p>Route A therefore does not infer certainty from foundational status. It leaves open the possibility that <strong>a foundational presentation becomes certain cognition after surviving sufficiently strong validation</strong>.</p>'),
              ('<p>Ordinary deduction or an inferential best explanation is not by itself sufficient for terminal closure under Route B, because competing possibilities may reappear when the premises, inference rules, or modal framework are themselves reasonably reconsidered. The target question must remain without an independent rival foothold even under reflective scrutiny of those inferential commitments.</p>', '<p>Ordinary deduction or an inferential best explanation is not by itself sufficient for terminal closure under Route B, because competing possibilities may reappear when the premises, inference rules, or modal framework are themselves reasonably reconsidered. The target question must remain without an independent rival foothold even under reflective scrutiny of those inferential commitments.</p>\n<p>For normative content that is unconceived by the present agent and not derivable from its existing normative premises—including a strong form of radically alien or “strange” goodness—this thesis does not assume that ordinary inference can generate genuinely new normative content from nothing. At least two entry points remain open: a <strong>new foundational normative presentation</strong> of the Route A kind, or inference that becomes possible only after cognitive expansion supplies new inferential capacities, representational schemes, or rules.</p>\n<p>For convenience, call the latter <strong>transcendent inference</strong>. The term is not supernatural: it means inference that the present cognitive system cannot fully perform, but that a reasonably reachable cognitively expanded agent could understand and validate. It is therefore not a third stopping route alongside A and B. Rather, it says that <strong>the inferential space relevant to Route B may itself change through cognitive expansion</strong>.</p>'),
              ('English translation · public working draft · 2026-08-20', 'English translation · public working draft · 2026-09-05'),
          ])
          PY
          rm -f .github/.stopping-condition-trigger .github/workflows/apply-stopping-condition.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Clarify reachable cognitive limits and normative inference"
          git push origin HEAD:align-agent-conditions-epistemic-integrity
