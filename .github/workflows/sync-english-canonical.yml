name: One-shot English canonical sync

on:
  push:
    branches:
      - sync-english-to-japanese-canonical

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-english-to-japanese-canonical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical Japanese-to-English sync
        run: python scripts/sync_en_from_ja.py
      - name: Remove one-shot machinery and commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/sync_en_from_ja.py .github/workflows/sync-english-canonical.yml
          git add README.md docs/en
          git diff --cached --check
          git commit -m "Sync English working translation to Japanese canonical text"
          git push origin HEAD:sync-english-to-japanese-canonical
