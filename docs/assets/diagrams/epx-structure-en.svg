<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" width="1200" height="1150" role="img" aria-labelledby="01-epx-title 01-epx-desc" lang="en">
<title id="01-epx-title">The reasoning behind E / P / X</title><desc id="01-epx-desc">Epistemic support, decision-theoretic support, and agent preferences and responsiveness inform reflective planning. They are not independent sufficient conditions. E, P, and X are overlapping functions. Evaluation weights within X are not resource shares. Unconceptualized possibilities do not supply determinate action criteria.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#80939c" /></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#227b76" /></marker></defs>
<rect width="1200" height="1150" fill="#fbfcfa" />
<g font-family="Arial, Helvetica, sans-serif" fill="#243746">
<text x="56" y="42" font-size="13.0" fill="#526674" text-anchor="start" font-weight="600"><tspan x="56" dy="0">01 / EPX</tspan></text>
<text x="56" y="91" font-size="32.0" fill="#243746" text-anchor="start" font-weight="600"><tspan x="56" dy="0">The reasoning behind E / P / X</tspan></text>
<text x="56" y="128" font-size="17.0" fill="#526674" text-anchor="start" font-weight="400"><tspan x="56" dy="0">Distinguish three inputs, then bring inquiry, preservation, and present practice into one plan.</tspan></text>
<rect x="56" y="175" width="344" height="143" rx="15" fill="#f0f3f1" stroke="#e1e7e3" stroke-width="1.5" />
<text x="78" y="204" font-size="13.0" fill="#526674" text-anchor="start" font-weight="600"><tspan x="78" dy="0">PREMISES &amp; CONSIDERATIONS</tspan></text>
<text x="78" y="237" font-size="18.0" fill="#243746" text-anchor="start" font-weight="400"><tspan x="78" dy="0">Evidence and reasoning</tspan><tspan x="78" dy="28.0">An incomplete hypothesis space</tspan><tspan x="78" dy="28.0">Unconceptualized possibilities</tspan></text>
<path d="M 228 318 V 341" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
<rect x="56" y="345" width="344" height="93" rx="15" fill="white" stroke="#476d9b" stroke-width="1.5" />
<text x="228" y="382" font-size="21.0" fill="#476d9b" text-anchor="middle" font-weight="600"><tspan x="228" dy="0">Epistemic support</tspan></text>
<text x="228" y="413" font-size="16.0" fill="#526674" text-anchor="middle" font-weight="400"><tspan x="228" dy="0">What to believe, and how strongly</tspan></text>
<path d="M 228 438 V 469 H 600" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<rect x="428" y="175" width="344" height="143" rx="15" fill="#f0f3f1" stroke="#e1e7e3" stroke-width="1.5" />
<text x="450" y="204" font-size="13.0" fill="#526674" text-anchor="start" font-weight="600"><tspan x="450" dy="0">PREMISES &amp; CONSIDERATIONS</tspan></text>
<text x="450" y="237" font-size="18.0" fill="#243746" text-anchor="start" font-weight="400"><tspan x="450" dy="0">Comparability; value of information</tspan><tspan x="450" dy="28.0">Irreversibility and risk</tspan><tspan x="450" dy="28.0">Opportunity and preservation costs</tspan></text>
<path d="M 600 318 V 341" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
<rect x="428" y="345" width="344" height="93" rx="15" fill="white" stroke="#227b76" stroke-width="1.5" />
<text x="600" y="382" font-size="21.0" fill="#227b76" text-anchor="middle" font-weight="600"><tspan x="600" dy="0">Decision-theoretic support</tspan></text>
<text x="600" y="413" font-size="16.0" fill="#526674" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">Which choices can be supported</tspan></text>
<path d="M 600 438 V 469 H 600" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<rect x="800" y="175" width="344" height="143" rx="15" fill="#f0f3f1" stroke="#e1e7e3" stroke-width="1.5" />
<text x="822" y="204" font-size="13.0" fill="#526674" text-anchor="start" font-weight="600"><tspan x="822" dy="0">PREMISES &amp; CONSIDERATIONS</tspan></text>
<text x="822" y="237" font-size="15" fill="#243746" text-anchor="start" font-weight="400"><tspan x="822" dy="0">Current goals, preferences, and concerns</tspan><tspan x="822" dy="28.0">Conditional responsiveness to justification</tspan><tspan x="822" dy="28.0">Avoiding reflective error</tspan></text>
<path d="M 972 318 V 341" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
<rect x="800" y="345" width="344" height="93" rx="15" fill="white" stroke="#9a7134" stroke-width="1.5" />
<text x="972" y="382" font-size="18" fill="#9a7134" text-anchor="middle" font-weight="600"><tspan x="972" dy="0">Agent preferences &amp; responsiveness</tspan></text>
<text x="972" y="413" font-size="16.0" fill="#526674" text-anchor="middle" font-weight="400"><tspan x="972" dy="0">What to pursue, and respond to</tspan></text>
<path d="M 972 438 V 469 H 600" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 600 469 V 501" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
<text x="578" y="494" font-size="13.0" fill="#526674" text-anchor="end" font-weight="400"><tspan x="578" dy="0">Consider all three together</tspan></text>
<rect x="354" y="510" width="492" height="82" rx="15" fill="#eaf3ef" stroke="#227b76" stroke-width="1.5" />
<text x="600" y="544" font-size="24" fill="#227b76" text-anchor="middle" font-weight="600"><tspan x="600" dy="0">Reflective allocation and planning</tspan></text>
<text x="600" y="574" font-size="17.0" fill="#526674" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">What to investigate, preserve, and do now</tspan></text>
<path d="M 600 592 V 623" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 264 623 H 936" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 264 623 V 650" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
<rect x="120" y="655" width="288" height="142" rx="15" fill="white" stroke="#476d9b" stroke-width="1.5" />
<text x="264" y="701" font-size="33.0" fill="#476d9b" text-anchor="middle" font-weight="600"><tspan x="264" dy="0">E</tspan></text>
<text x="264" y="739" font-size="21.0" fill="#476d9b" text-anchor="middle" font-weight="600"><tspan x="264" dy="0">Active inquiry</tspan></text>
<text x="264" y="774" font-size="15.0" fill="#526674" text-anchor="middle" font-weight="400"><tspan x="264" dy="0">Investigate now</tspan></text>
<path d="M 600 623 V 650" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
<rect x="456" y="655" width="288" height="142" rx="15" fill="white" stroke="#227b76" stroke-width="1.5" />
<text x="600" y="701" font-size="33.0" fill="#227b76" text-anchor="middle" font-weight="600"><tspan x="600" dy="0">P</tspan></text>
<text x="600" y="739" font-size="21.0" fill="#227b76" text-anchor="middle" font-weight="600"><tspan x="600" dy="0">Preserving explorability</tspan></text>
<text x="600" y="774" font-size="13" fill="#526674" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">Keep future inquiry and change possible</tspan></text>
<path d="M 936 623 V 650" fill="none" stroke="#80939c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
<rect x="792" y="655" width="288" height="142" rx="15" fill="white" stroke="#9a7134" stroke-width="1.5" />
<text x="936" y="701" font-size="33.0" fill="#9a7134" text-anchor="middle" font-weight="600"><tspan x="936" dy="0">X</tspan></text>
<text x="936" y="739" font-size="21.0" fill="#9a7134" text-anchor="middle" font-weight="600"><tspan x="936" dy="0">Present practice</tspan></text>
<text x="936" y="774" font-size="13" fill="#526674" text-anchor="middle" font-weight="400"><tspan x="936" dy="0">Act on current goals and value judgments</tspan></text>
<path d="M 936 797 V 823 H 600 V 851" fill="none" stroke="#9a7134" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<text x="804" y="846" font-size="13.0" fill="#9a7134" text-anchor="middle" font-weight="400"><tspan x="804" dy="0">A closer look inside X</tspan></text>
<rect x="224" y="861" width="752" height="171" rx="15" fill="#fbf7ef" stroke="#d8c8a8" stroke-width="1.5" />
<text x="600" y="896" font-size="21.0" fill="#9a7134" text-anchor="middle" font-weight="600"><tspan x="600" dy="0">Practical criteria endorsed under each hypothesis</tspan></text>
<text x="600" y="932" font-size="16" fill="#243746" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">Preferences, concerns, and cooperation / Welfare conditional on subjects existing</tspan><tspan x="600" dy="29.0">Contractualism / Deontology / Total utilitarianism / Virtue ethics / Other views</tspan></text>
<text x="600" y="1007" font-size="14.0" fill="#526674" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">Examples, not mutually exclusive or exhaustive categories of theories</tspan></text>
<text x="600" y="1071" font-size="16.0" fill="#526674" text-anchor="middle" font-weight="400"><tspan x="600" dy="0">One activity may contribute to E, P, and X. Box size does not indicate resource shares.</tspan></text>
<text x="600" y="1101" font-size="16.0" fill="#243746" text-anchor="middle" font-weight="600"><tspan x="600" dy="0">Epistemic support ≠ evaluation weights for practical criteria ≠ resource shares</tspan></text>
</g>
