      &quot;source&quot;,
      &quot;relation&quot;,
      &quot;target&quot;,
      &quot;optional condition&quot;
    ],
    &quot;omission&quot;: &quot;Unspecified, not false.&quot;,
    &quot;judgment_domain&quot;: &quot;Maps a judgment to the domain in which it is made.&quot;,
    &quot;mutual_revision&quot;: &quot;Listed models are revised in relation to one another.&quot;,
    &quot;relation_definitions&quot;: {
      &quot;next&quot;: &quot;Next procedural step, not logical entailment.&quot;,
      &quot;revises&quot;: &quot;Reassesses or revises the target.&quot;
    }
  },
  &quot;states&quot;: {
    &quot;INPUT&quot;: [
      &quot;goals and responsiveness&quot;,
      &quot;worldviews and causal hypotheses&quot;,
      &quot;options, resources, and constraints&quot;
    ],
    &quot;COMPARE&quot;: [
      &quot;combine E, P, and X&quot;,
      &quot;compare alternatives and inaction&quot;,
      &quot;assess effects, costs, burdens, and irreversibility&quot;
    ],
    &quot;PLAN&quot;: [
      &quot;select present action&quot;,
      &quot;preserve routes for revision, exit, and recovery&quot;,
      &quot;specify observations and review triggers&quot;
    ],
    &quot;ACT&quot;: [
      &quot;act, record outcomes, and monitor premises&quot;,
      &quot;retain achievement history&quot;
    ]
  },
  &quot;transitions&quot;: [
    [
      &quot;INPUT&quot;,
      &quot;next&quot;,
      &quot;COMPARE&quot;
    ],
    [
      &quot;COMPARE&quot;,
      &quot;next&quot;,
      &quot;PLAN&quot;
    ],
    [
      &quot;PLAN&quot;,
      &quot;next&quot;,
      &quot;ACT&quot;
    ],
    [
      &quot;ACT&quot;,
      &quot;revises&quot;,
      &quot;INPUT&quot;,
      &quot;relevant evidence, error, or change&quot;
    ],
    [
      &quot;ACT&quot;,
      &quot;next&quot;,
      &quot;ACT&quot;,
      &quot;no relevant change&quot;
    ]
  ],
  &quot;constraints&quot;: [
    &quot;Transitions describe a revisable procedure, not logical entailments.&quot;,
    &quot;Use only justified comparisons and numerical precision.&quot;,
    &quot;Do not reset history and recount an achieved benefit as new.&quot;,
